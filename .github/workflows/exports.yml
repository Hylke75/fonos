# Elk uur de nieuwste fonotheek.db.gz van de scraper-branch naar main halen, zodat de volgende build hem inleest.
# Alleen dat ene bestand; andere wijzigingen op de scraper-branch worden niet overgenomen.
name: fonotheek.db naar main

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  BRON: claude/bold-cori-74kzz2

jobs:
  fonotheek:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Nieuwe fonotheek.db.gz overnemen
        run: |
          git fetch --depth=1 origin "$BRON"
          git checkout "origin/$BRON" -- fonotheek.db.gz
          if git diff --cached --quiet -- fonotheek.db.gz; then echo "Niets nieuws."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nieuwe fonotheek.db.gz van $BRON overnemen ($(git rev-parse --short "origin/$BRON"))"
          git push origin HEAD:main
