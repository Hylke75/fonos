# IT-beleid 4.7: fixes voor kwetsbaarheden zo snel mogelijk doorvoeren.
# Dependabot opent wekelijks pull requests voor verouderde pakketten (en direct bij beveiligingslekken);
# die gaan via de gewone CI en worden pas na review samengevoegd.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      kleine-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
